name: Compilar APK Android (Mi Plata)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permite compilar manualmente con un clic en GitHub

jobs:
  build-android-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Instalar dependencias del proyecto
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: 6. Compilar aplicación web
        run: npm run build

      - name: 7. Inicializar y sincronizar Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 8. Otorgar permisos de ejecución a Gradle
        run: chmod +x android/gradlew
        working-directory: .

      - name: 9. Compilar APK Android (Debug / Release)
        run: ./gradlew assembleDebug
        working-directory: android

      - name: 10. Subir archivo APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: MiPlata-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
