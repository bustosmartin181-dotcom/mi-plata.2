name: Compilar APK Android (Mi Plata)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Verificar archivos del proyecto
        run: |
          if [ ! -f "package.json" ]; then
            echo "::error::❌ ERROR: No se encontró package.json en el repositorio."
            exit 1
          fi
          echo "✓ package.json encontrado"

      - name: 3. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 5. Instalar dependencias
        run: |
          npm install --legacy-peer-deps

      - name: 6. Compilar aplicación web
        run: npm run build

      - name: 7. Inicializar y sincronizar Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 8. Compilar APK Android con Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 9. Subir archivo APK
        uses: actions/upload-artifact@v4
        with:
          name: MiPlata-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
